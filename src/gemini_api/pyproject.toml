[project]
name = "ripesense"
version = "0.2.0"
description = "Fruit ripeness cabinet: RealSense + AS7341 + gas sensor fusion on a Raspberry Pi 5"
requires-python = ">=3.11"
dependencies = ["numpy", "flask>=3", "scikit-learn>=1.4", "joblib", "segno"]

[project.optional-dependencies]
pi = ["adafruit-blinka", "adafruit-circuitpython-as7341", "adafruit-circuitpython-ads1x15",
      "adafruit-circuitpython-bme680", "gpiozero", "lgpio"]
extras = ["onnxruntime", "google-genai", "psycopg[binary]"]
dev = ["pytest", "opencv-python-headless"]

[project.scripts]
ripesense = "ripesense.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
